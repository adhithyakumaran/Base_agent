automation:
  recommended_framework: Playwright

  locator_strategy:
    resolution_order:
      - primary
      - fallback_1
      - fallback_2
      - fallback_3

    uniqueness_validation:
      - If locator resolves to 0 elements, try the next locator.
      - If locator resolves to exactly 1 element, accept it.
      - If locator resolves to more than 1 element, reject it as ambiguous.

  primary_locators:
    rivaah_navigation: "#t_MenuNav_3i"
    wedding_trousseau_styling: "a.t-Card-wrap[href*='/wedding-trousseau?']"
    trousseau_set_image: "a.t-Card-wrap[href*='/wedding-trousseau1']"
    engagement_rings: "a.t-Card-wrap[href*='/standard-product-search']"
    wedding_experts: "a.t-Card-wrap[href*='/wedding-experts']"
    rivaah_wedding_wishlist: "a.t-Card-wrap[href*='/dreams-in-gold']"
    back_button: "#B50666671840999844"

  fallback_locators:
    status: Candidate
    validation_required:
      - All fallback locators must pass runtime uniqueness validation.
      - Generic card selectors must not be accepted if multiple cards
        are returned.

  reusable_actions:
    - navigate_to_rivaah
    - verify_rivaah_page
    - verify_rivaah_features
    - open_wedding_trousseau_styling
    - open_trousseau_set_image
    - open_engagement_rings
    - open_wedding_experts
    - open_rivaah_wedding_wishlist
    - return_to_home

  self_healing:
    enabled: true
    behavior:
      - Try validated fallback locators if the primary locator fails.
      - Record the failed primary locator.
      - Capture current DOM and page evidence.
      - Record the successful fallback locator.
      - Analyze the UI change.
      - Recommend a permanent locator update only after validation.
      - Do not permanently modify automation without approval.

test_data:
  authenticated_user:
    source: DEV/UAT test credentials
    value: DO_NOT_STORE_IN_KB

  customer_context:
    source: DEV/UAT application context
    value: LOGICAL_REFERENCE_ONLY

security:
  sensitive_data_policy:
    - Do not store real credentials in the KB.
    - Do not store session IDs.
    - Do not store authentication tokens.
    - Do not store cookies.
    - Do not store raw protected request/response values.
    - Store logical customer/test-data references instead.

  security_relevance:
    - Rivaah feature access should respect authenticated-user permissions.
    - Individual Rivaah feature URLs should not bypass authorization.
    - Customer-specific data, if used by Rivaah features, must be protected.
    - Feature visibility should not be treated as the only authorization control.

evidence:
