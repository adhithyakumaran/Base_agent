automation:
  recommended_framework: Playwright

  primary_locators:
    - >
      Use stable APEX IDs or validated DOM attributes for
      Best Deal navigation.

    - >
      Use stable Product Discount filter item IDs where confirmed.

    - >
      Use validated product-card attributes for product selection.

    - >
      Use stable page-item IDs for product detail validation
      where applicable.

  fallback_locators:
    - >
      Use accessible labels.
    - >
      Use stable APEX page-item IDs.
    - >
      Use validated DOM relationships.
    - >
      Use visible product names only when uniqueness is confirmed.

  locator_validation:
    rule: >
      Every locator must resolve to exactly one intended element.
    resolution:
      0: Try next fallback.
      1: Accept locator.
      greater_than_1: Reject as ambiguous.

  reusable_actions:
    - Navigate to Best Deal
    - Validate Product Discount page
    - Locate filter
    - Apply Brand filter
    - Apply Price filter
    - Apply Discount filter
    - Apply Jewellery Type filter
    - Apply Product filter
    - Apply Gender filter
    - Apply Collection filter
    - Apply Type filter
    - Apply Best of Best Deal filter
    - Select discounted product
    - Open Discount Product Details
    - Validate product identity
    - Validate price
    - Validate discount
    - Navigate Back to Products

  self_healing:
    enabled: true
    behavior:
      - Capture failed locator and DOM/page evidence.
      - Identify the affected filter or product component.
      - Search for a validated alternative locator.
      - Validate uniqueness.
      - Use fallback only when safely validated.
      - Record locator degradation.
      - Propose permanent locator update.
      - Require human approval before permanent automation modification.

test_data:
  required:
    - Valid authenticated application user
    - Valid Best Deal product
    - Valid discount
    - Valid filter values where applicable

  restrictions:
    - Do not store credentials.
    - Do not store session IDs.
    - Do not store cookies or authentication tokens.
    - Use logical product/test-data references.

security:
  authentication_required: true

  authorization:
    - User must have access to Best Deal.
    - Product visibility must respect current store/customer context.

  sensitive_data:
    - No credentials stored in KB.
    - No session information stored in KB.
    - No authentication tokens stored in KB.

  validation:
    - Verify product visibility against the authorized store/customer context.

evidence:
  source:
    type: Browser Recorder
    recording: browser-recording-endless-aisle-20260905-1750.zip

  supplementary_evidence:
    - User-provided Home screenshot showing Best Deal entry.

  evidence_available:
    - Screenshots
    - DOM snapshots
    - User interactions
    - Navigation evidence
    - Filter interactions
    - Product selection
    - Product detail navigation
    - Network activity
    - Console activity

  limitations:
    - Exact Best Deal classification algorithm is unknown.
    - Exact discount calculation rules are unknown.
    - Exact no-result behavior is unknown.
    - Store/customer context implementation details are unknown.

status:
  overall: READY
  confidence: High
  business_coverage: High
  technical_coverage: Very High
