flow_id: BF-BEST-DEAL-008

flow_name: Best Deal

application:
  name: Endless Aisle
  platform: Oracle APEX
  application_id: 1002
  environment: DEV/UAT

purpose:
  description: >
    Allows authenticated users to browse discounted and Best Deal
    products and refine the displayed products using applicable
    product, discount, price, and classification filters.

entry_point:
  page: Home
  navigation: >
    Login → Home → Best Deal → Product Discount

actors:
  - Authenticated User

preconditions:
  - User is authenticated.
  - User has access to Best Deal.
  - Application is available.
  - Best Deal product data is available.

pages:
  - name: Home
    route: /ords/r/tjdcom/ea/home

  - page_id: 92
    name: Product Discount

  - page_id: 93
    name: Discount Product Details - All Store
    route: /ords/r/tjdcom/ea/discount-product-details-all-store

components:
  - name: Best Deal
    type: Navigation/Card
    action: Opens the Product Discount page.

  - name: Product Discount
    type: Product Listing
    action: >
      Displays discounted/Best Deal products.

  - name: Filter Panel
    type: Filter
    filters:
      - Brand
      - Price
      - Discount
      - Jewellery Type
      - Product
      - Gender
      - Collection
      - Type
      - Boutique/Type
      - Best of Best Deal

  - name: Product
    type: Product Card
    action: Opens Discount Product Details - All Store.

  - name: Discount Product Details
    type: Product Detail
    action: >
      Displays details and pricing/discount information for
      the selected discounted product.

  - name: Back to Products
    type: Navigation Button
    action: >
      Returns to the Product Discount page.

business_flow:
  steps:
    - step: 1
      action: Navigate to Home after authentication.

    - step: 2
      action: Select Best Deal.

    - step: 3
      action: >
        Verify that the Product Discount page opens.

    - step: 4
      action: >
        Verify that Best Deal/discounted products are displayed.

    - step: 5
      action: >
        Apply applicable filters such as Brand, Price, Discount,
        Jewellery Type, Product, Gender, Collection, and Type.

    - step: 6
      action: >
        Verify that the resulting products satisfy the selected
        filter criteria.

    - step: 7
      action: >
        Select a discounted product.

    - step: 8
      action: >
        Verify that Discount Product Details - All Store opens.

    - step: 9
      action: >
        Verify that the product details correspond exactly to
        the selected product.

    - step: 10
      action: >
        Validate the displayed discount and price values.

    - step: 11
      action: >
        Verify that out-of-stock discounted products can still
        be viewed.

    - step: 12
      action: >
        Use Back to Products.

    - step: 13
      action: >
        Verify that the user returns to Product Discount.

expected_success:
  - Best Deal opens successfully from Home.
  - Product Discount page loads successfully.
  - Discounted/Best Deal products are displayed.
  - Users can apply applicable product filters.
  - Filtered results satisfy the selected filter criteria.
  - Users can select a discounted product.
  - Discount Product Details - All Store opens successfully.
  - Product details exactly match the selected product.
  - Displayed price and discount values are correct.
  - Out-of-stock discounted products can still be viewed.
  - The flow respects the current store/customer context.
  - Back to Products returns to Product Discount.

observed_scenarios:
  - scenario: Home → Best Deal
    status: Observed

  - scenario: Product Discount page loaded
    status: Observed

  - scenario: Best Deal filters displayed
    status: Observed

  - scenario: Discounted product selected
    status: Observed

  - scenario: Discount Product Details - All Store opened
    status: Observed

  - scenario: Back to Products
    status: Observed

business_rules:
  - rule: >
      Best Deal provides access to discounted/best-deal products.

  - rule: >
      Users can filter Best Deal products using the available
      product and classification filters.

  - rule: >
      Products displayed through Best Deal must represent
      discounted/Best Deal products.

  - rule: >
      Out-of-stock discounted products can still be viewed.

  - rule: >
      A selected Best Deal product can be opened in
      Discount Product Details - All Store.

  - rule: >
      Product details must exactly correspond to the selected product.

  - rule: >
      Price and discount values must be validated.

  - rule: >
      Best Deal respects the current store/customer context.

  - rule: >
      Back to Products returns to the Product Discount page.

  - rule: >
      Applicable filters must be validated.

  - rule: >
      No additional business rules were specified.

unknown_business_rules:
  - Exact algorithm used to classify a product as a Best Deal.
  - Exact discount calculation/business formula.
  - Exact meaning and eligibility criteria of Best of Best Deal.
  - Exact rules governing store/customer-specific Best Deal visibility.
  - Exact behavior when no products match selected filters.
  - Exact minimum/maximum discount rules.

