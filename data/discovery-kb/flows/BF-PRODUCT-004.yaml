flow_id: BF-PRODUCT-004

flow_name: View Product

application:
  name: Endless Aisle
  environment: DEV/UAT
  apex_application_id: 1002

purpose:
  Display detailed information for the product selected or searched by
  the authenticated user, including product identification, images,
  pricing, product attributes and availability information.

entry_point:
  pages:
    - Product Search
    - Product Catalogue
    - All Products

actors:
  - Authenticated application user

preconditions:
  - Endless Aisle DEV/UAT application is accessible.
  - User is successfully authenticated.
  - User has access to product information.
  - A valid product has been selected or searched.

pages:
  - Product Search
  - Product Catalogue
  - All Products
  - Product Detail

components:
  product_information:
    type: product_detail_region
    purpose: Display selected product information
    attributes_observed:
      - Item code / SKU
      - Product name
      - Product image
      - Product price
      - User / gender
      - Occasion
      - Jewellery Type
      - Category
      - Karatage
      - Diamond Quality
      - Metal Color
      - MTO Lead Time
      - Availability status

  product_images:
    type: image_gallery
    purpose: Display product images
    behavior:
      - Main product image is displayed.
      - Additional product images/thumbnails are available.
      - Product imagery can include multiple views.
      - A 360-degree product view may be available.

  stock_availability:
    type: information_region
    purpose: Display product stock status
    observed_states:
      - In Stock
      - Not in Stock
      - Item Sold Out
      - No Stock available in Store and Factory

  back_to_products:
    type: navigation_action
    action: Return to Products
    status: Observed

  production_order:
    type: external_action
    action: Proceed to My Crown Portal for initiating production order
    status: Observed for applicable out-of-stock state

business_flow:
  - User searches for or selects a product.
  - Application identifies the selected product.
  - Application opens Product Detail.
  - Product information is displayed.
  - Product images are displayed.
  - Product attributes are displayed.
  - Product price is displayed where applicable.
  - Product availability is displayed.
  - If the product is out of stock, the out-of-stock status is displayed.
  - If applicable, the user can proceed to the production-order process.
  - User can return to the Products/Product Search context.

expected_success:
  condition:
    - A valid product has been selected or searched.
  result:
    - Product Detail page is displayed.
    - The displayed details belong to the exact selected/searched product.
    - Product identification information is displayed.
    - Product imagery is displayed.
    - Product attributes are displayed.
    - Applicable price information is displayed.
    - Product availability status is displayed.
    - User can return to the appropriate Products/Product Search context.

observed_out_of_stock:
  condition:
    - Selected product is not available in the applicable stock context.
  result:
    - Product Detail is still displayed.
    - Product is explicitly marked as Not in Stock / Sold Out.
    - Stock availability information is displayed.
    - Where applicable, the production-order action is presented.

business_rules:
  BR-VIEW-001:
    rule: A valid selected or searched product must open its corresponding
      Product Detail information.
    status: Confirmed/Observed

  BR-VIEW-002:
    rule: Product Detail must display information belonging to the exact
      product selected or searched by the user.
    status: Confirmed

  BR-VIEW-003:
    rule: A product can be viewed even when it is out of stock.
    status: Confirmed

  BR-VIEW-004:
    rule: An out-of-stock product must display an appropriate out-of-stock
      status.
    status: Confirmed/Observed

  BR-VIEW-005:
    rule: Product Detail displays applicable product information including
      product identification, images, attributes, price and availability.
    status: Confirmed/Observed

  BR-VIEW-006:
    rule: The user can return from Product Detail to the applicable
      Products/Product Search context.
    status: Confirmed

  BR-VIEW-007:
    rule: When applicable, an out-of-stock product provides an action to
      proceed to the production-order process.
    status: Observed

unknown_business_rules:
  - Which individual product attributes are mandatory for every product.
  - Whether price is mandatory for every product type.
  - Exact behavior when a product identifier is invalid or no longer exists.
  - Exact behavior when product details cannot be retrieved.
  - Whether all products must have multiple images.
  - Whether the 360-degree view is available for every product.
  - Exact rules determining when the production-order action is displayed.
  - Exact authorization rules for viewing product information.
  - Exact behavior when product information/API retrieval fails.
  - Exact caching/refresh behavior for product information.

