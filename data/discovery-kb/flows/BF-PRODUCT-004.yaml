automation:
  recommended_framework: Playwright

  locator_strategy:
    resolution_order:
      - primary
      - fallback_1
      - fallback_2
      - fallback_3

    uniqueness_validation:
      - If locator resolves to 0 elements, try the next locator.
      - If locator resolves to exactly 1 element, accept it.
      - If locator resolves to more than 1 element, reject it as ambiguous.

  primary_locators:
    product_detail: "To be finalized from DOM inspection"
    product_identifier: "To be finalized from DOM inspection"
    product_name: "To be finalized from DOM inspection"
    product_price: "To be finalized from DOM inspection"
    availability_status: "To be finalized from DOM inspection"
    back_to_products: "To be finalized from DOM inspection"

  fallback_locators:
    status: Pending DOM inspection
    note:
      - The supplied screenshots establish visual components but do not
        provide sufficient DOM attributes to safely create stable fallback
        locators.
      - Locators must be obtained from DOM inspection rather than invented.

  reusable_actions:
    - navigate_to_product_detail
    - verify_product_identifier
    - verify_product_name
    - verify_product_image
    - verify_product_price
    - verify_product_attributes
    - verify_product_availability
    - verify_out_of_stock_status
    - verify_exact_product
    - return_to_products
    - verify_production_order_action_when_applicable

  self_healing:
    enabled: true
    behavior:
      - Try validated fallback locators if the primary locator fails.
      - Record the failed primary locator.
      - Capture current DOM and page evidence.
      - Record the successful fallback locator.
      - Analyze the UI change.
      - Recommend a permanent locator update only after validation.
      - Do not permanently modify automation without approval.

test_data:
  valid_product:
    source: DEV/UAT approved product test data
    value: LOGICAL_REFERENCE_ONLY

  out_of_stock_product:
    source: DEV/UAT approved out-of-stock product
    value: LOGICAL_REFERENCE_ONLY

  product_identifier:
    source: Product test data
    value: DO_NOT_STORE_REAL_VALUE

security:
  sensitive_data_policy:
    - Do not store real credentials in the KB.
    - Do not store session IDs.
    - Do not store authentication tokens.
    - Do not store cookies.
    - Do not store raw protected request/response values.
    - Store logical product/test-data references instead.

  security_relevance:
    - Product details must correspond to the authorized product context.
    - Product information must not expose data outside the user's
      authorized store/customer context.
    - Product-detail APIs should enforce authorization server-side.
    - Product identifiers must not be treated as authorization controls.
    - The production-order action should be checked for appropriate
      authorization by the Security Agent.

evidence:
  sources:
    - Browser interaction recording
    - Product Detail screenshots
    - Product Search/Product Catalogue navigation evidence
    - DOM/component information where available
    - Network activity captured during product navigation
    - Product availability evidence

status:
  overall: READY
  confidence: High for observed Product Detail behavior
  business_rule_gaps: Present
  locator_status:
    primary_locators: Pending DOM inspection
    fallback_locators: Pending DOM inspection
