automation:

  recommended_framework: Playwright

  primary_locators:

    customer:
      - text: Customer ( Click to Select )
      - validated navigation-bar element

    user_menu:
      - "#L21731618447730172"

    settings:
      - text: Settings
      - "#menu_L21731618447730172_0"

    orso_recommendation:
      - text: ORSO Recommendation

    store_stock:
      - "#B74402876591024608"

  fallback_locators:
    - Accessible name
    - Stable element ID
    - Validated text
    - Stable href
    - Validated DOM relationship

  locator_validation:
    rule: >
      Every locator must resolve to exactly one intended component.

    resolution:
      0: Try next fallback.
      1: Accept locator.
      greater_than_1: Reject ambiguous locator.

  reusable_actions:
    - Open Customer Selector
    - Close Customer Drawer
    - Open User Menu
    - Open Settings
    - Close Settings
    - Open ORSO Recommendation
    - Close ORSO Recommendation
    - Read Store Context
    - Open Store Stock

  self_healing:
    enabled: true
    behavior:
      - Capture failed component locator.
      - Inspect current Home DOM.
      - Match stable text/accessible name.
      - Validate uniqueness.
      - Use validated fallback.
      - Capture evidence.
      - Propose permanent locator update.
      - Require human approval before permanent automation update.

