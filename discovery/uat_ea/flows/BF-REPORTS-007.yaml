business_rules:
  - rule: >
      Reports provides access to operational/business reporting
      functionality.

  - rule: >
      Reports supports both viewing reports and generating/running
      reports using applicable controls.

  - rule: >
      All authenticated users can access the Reports module.

  - rule: >
      QA validation of the general Reports flow focuses on successful
      page/report loading rather than validating the correctness of
      the underlying business data.

  - rule: >
      Applicable date filters must be validated.

  - rule: >
      Applicable store filters must be validated.

  - rule: >
      Applicable category and report-specific filters must be validated.

  - rule: >
      Interactive report Actions must be validated when applicable.

  - rule: >
      Back from an individual report returns to the Reports Master Page.

  - rule: >
      Export/download validation is required only for specifically
      designated reports, not automatically for every report.

  - rule: >
      No additional business rules were specified.

unknown_business_rules:
  - Exact report-specific authorization rules beyond the master
    Reports access rule.
  - Whether individual reports respect store/customer context.
  - Exact store/customer context behavior for each report.
  - Exact list of reports requiring export/download validation.
  - Exact business meaning and expected data semantics of each report.
  - Exact error behavior for invalid date/filter combinations.
  - Exact behavior when a report returns no data.

