  reusable_report_patterns:

    date_range:
      description: >
        Reports using From Date and To Date controls.
      common_items:
        - FROM_DATE
        - TO_DATE
      expected_format: DD-Mon-YYYY

    date_range_store:
      description: >
        Reports using date range plus store selection.
      examples:
        - PDF/WhatsApp Export Report
        - TryOn Usage
        - Image Search Usage

    date_store_category:
      description: >
        Reports using date, store, and category filtering.
      example:
        - Image Search Usage

    business_identifier_search:
      description: >
        Reports using business-specific identifiers instead of
        or in addition to date filters.
      example:
        - Manual Bill Report

    interactive_report:
      description: >
        Reports exposing Actions, Format, sorting/filtering or
        other interactive-report functionality where applicable.

automation:
  recommended_framework: Playwright

  primary_locators:
    master_reports:
      - >
        Use the visible report name to identify the intended report entry,
        combined with a validated stable DOM relationship.

    report_controls:
      - >
        Prefer stable APEX item IDs such as P101_FROM_DATE or
        P139_BILL_NO where confirmed.

    date_picker:
      - >
        Prefer the associated APEX page-item ID and calendar trigger
        relationship.

    actions:
      - >
        Use the report region's validated Actions button when applicable.

  fallback_locators:
    - >
      Use accessible labels.
    - >
      Use stable APEX page-item IDs.
    - >
      Use validated DOM relationships.
    - >
      Use visible report names only when uniqueness is confirmed.

  locator_validation:
    rule: >
      Every locator must resolve to exactly one intended element.
    resolution:
      0: Try next fallback.
      1: Accept locator.
      greater_than_1: Reject as ambiguous.

  reusable_actions:
    - Navigate to Reports
    - Locate report by name
    - Open report
    - Detect report filter pattern
    - Set From Date
    - Set To Date
    - Select Store
    - Select Category
    - Enter report-specific identifier
    - Click Go
    - Click Search
    - Click Clear
    - Open Actions
    - Validate applicable report controls
    - Navigate Back
    - Return to Reports Master Page

  self_healing:
    enabled: true
    behavior:
      - Capture failed locator and DOM/page evidence.
      - Identify the affected report and page.
      - Search for a validated alternative locator.
      - Validate uniqueness.
      - Use fallback only when safely validated.
      - Record locator degradation.
      - Propose permanent locator update.
      - Require human approval before permanent automation modification.

test_data:
