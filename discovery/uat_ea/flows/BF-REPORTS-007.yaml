flow_id: BF-REPORTS-007

flow_name: Reports

application:
  name: Endless Aisle
  platform: Oracle APEX
  application_id: 1002
  environment: DEV/UAT

purpose:
  description: >
    Provides authenticated users with access to operational and business
    reports and allows users to generate/run reports using applicable
    filters and report controls.

entry_point:
  page: Home
  navigation: >
    Login → Home → Reports → Reports Master Page

actors:
  - Authenticated User

preconditions:
  - User is authenticated.
  - User has access to the Reports module.
  - Application is available.
  - Required report data is available.

pages:
  - name: Home
    route: /ords/r/tjdcom/ea/home

  - page_id: 51
    name: Reports
    route: /ords/r/tjdcom/ea1/51

components:
  - name: Reports
    type: Navigation/Card
    action: Opens the Reports Master Page.

  - name: Reports Master Page
    type: Report Dashboard
    action: >
      Displays the available reports as selectable report entries.

  - name: Report Entry
    type: Navigation Item
    action: >
      Opens the corresponding individual report page.

  - name: Date Filter
    type: Date Picker
    applicable: Report dependent
    expected_format: DD-Mon-YYYY

  - name: Store Filter
    type: Select/List
    applicable: Report dependent

  - name: Category Filter
    type: Select/List
    applicable: Report dependent

  - name: Report-specific Filters
    type: Form Input
    applicable: Report dependent

  - name: Go
    type: Button
    action: >
      Executes/refreshes the report using the selected filter values.

  - name: Search
    type: Button
    action: >
      Executes a report using report-specific search criteria.

  - name: Clear
    type: Button
    action: >
      Clears applicable report filter values.

  - name: Actions
    type: Interactive Report Menu
    applicable: Report dependent
    action: >
      Provides report-specific interactive-report operations.

  - name: Back
    type: Navigation Button
    action: >
      Returns to the Reports Master Page.

business_flow:
  steps:
    - step: 1
      action: Navigate to Home after authentication.

    - step: 2
      action: Select Reports.

    - step: 3
      action: >
        Verify that the Reports Master Page opens.

    - step: 4
      action: >
        Verify that available report entries are displayed.

    - step: 5
      action: >
        Select the required report.

    - step: 6
      action: >
        Verify that the corresponding report page opens.

    - step: 7
      action: >
        Identify the filters applicable to the selected report.

    - step: 8
      action: >
        Apply valid date, store, category, or report-specific
        filter values where applicable.

    - step: 9
      action: >
        Execute the report using Go or Search as applicable.

    - step: 10
      action: >
        Verify that the report page/report component loads successfully.

    - step: 11
      action: >
        If an Actions menu or other report controls are available,
        validate that the applicable controls are accessible.

    - step: 12
      action: >
        If Clear is available, validate that the report filters
        can be cleared.

    - step: 13
      action: >
        Use Back where available.

    - step: 14
      action: >
        Verify that Back returns to the Reports Master Page.

expected_success:
  - Reports opens successfully from Home.
  - Reports Master Page loads successfully.
  - Available report entries are displayed.
  - Selecting a report opens the correct report page.
  - Applicable filters are displayed.
  - Date filters accept the expected date format.
  - Store filters are available where applicable.
  - Category/report-specific filters are available where applicable.
  - Go/Search executes the applicable report operation.
  - The report page/report component loads successfully.
  - Applicable Actions controls are accessible.
  - Applicable Clear controls work.
  - Back returns to the Reports Master Page.

