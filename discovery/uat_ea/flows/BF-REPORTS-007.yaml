    - Valid authenticated application user
    - Valid date range
    - Valid store where applicable
    - Valid category where applicable
    - Valid report-specific identifiers where applicable

  restrictions:
    - Do not store credentials.
    - Do not store session IDs.
    - Do not store cookies or authentication tokens.
    - Use logical test-data references.

security:
  authentication_required: true

  authorization:
    - Reports Master Page is available to authenticated users.
    - Individual report authorization behavior is currently unknown.

  sensitive_data:
    - Do not store authentication secrets.
    - Do not store session information.
    - Avoid storing customer-sensitive report data in the KB.

  validation:
    - Verify authenticated access to Reports.
    - Individual report authorization should be validated when
      role-specific behavior is established.

