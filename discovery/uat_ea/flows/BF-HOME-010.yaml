automation:

  recommended_framework: Playwright

  automation_strategy:
    principle: >
      Do not build one independent automation implementation for every
      Home card. Model Home as a navigation registry and reuse shared
      business-flow/page objects.

    architecture:
      - HomePage
      - NavigationRegistry
      - ProductSearchPatterns
      - ProductListingPage
      - ProductDetailPage
      - StockVisibilityPage
      - RivaahFlows
      - ReportsFlows
      - BestDealFlows
      - ManualInvoiceFlows

  primary_locators:
    home_cards:
      selector: >
        li.custom-card-item > div.custom-card >
        a.custom-card-wrap

    home_card_image:
      selector: >
        li.custom-card-item > div.custom-card >
        a.custom-card-wrap > div.custom-card-image > img

    navigation:
      strategy: >
        Prefer stable navigation IDs, accessible names, hrefs,
        or validated card text over the generic card-image selector.

  fallback_locators:
    - Accessible card name
    - Visible card title
    - Stable href/path
    - Validated DOM relationship

  locator_validation:
    rule: >
      Generic Home card selectors are not sufficient by themselves
      to identify a specific business function.

    resolution:
      0: Try another validated locator.
      1: Accept.
      greater_than_1: Reject as ambiguous.

    important_rule: >
      The generic selector
      "li.custom-card-item > div.custom-card > a.custom-card-wrap >
      div.custom-card-image > img"
      matches multiple Home cards and must never be used alone to
      select a specific business function.

  reusable_actions:
    - Verify Home loaded
    - Read Store Context
    - Read Customer Context
    - Locate Home Business Card
    - Open Business Function
    - Navigate Home
    - Navigate using validated application path
    - Validate destination page
    - Return to Home
    - Sign Out

  product_reusable_actions:
    - Search by SKU
    - Search by Item Code
    - Search by Lot Number
    - Apply Product Filter
    - Open Product Card
    - Validate Product Detail
    - Navigate Back to Products
    - Validate Stock Information

  self_healing:
    enabled: true
    behavior:
      - Capture failed Home-card locator.
      - Inspect current DOM.
      - Match visible card title/text.
      - Match stable href where available.
      - Validate uniqueness.
      - Use validated fallback.
      - Capture evidence.
      - Propose locator update.
      - Require human approval before permanent automation modification.

