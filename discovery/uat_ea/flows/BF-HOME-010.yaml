flow_id: BF-HOME-010

flow_name: Home Page / Application Navigation Map

application:
  name: Endless Aisle
  platform: Oracle APEX
  application_id: 1002
  environment: DEV/UAT

purpose:
  description: >
    Provides the authenticated user's main entry point into Endless Aisle
    and exposes business-function cards/navigation items for product
    discovery, product search, stock visibility, customer activities,
    Rivaah, reports, administration, billing, and other application
    capabilities.

entry_point:
  page: Login
  navigation:
    - Login
    - Home

actors:
