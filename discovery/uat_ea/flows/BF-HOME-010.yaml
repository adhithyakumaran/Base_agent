business_rules:

  - rule: >
      Home is the primary authenticated application hub.

  - rule: >
      Home exposes multiple business functions through cards/navigation.

  - rule: >
      Product-related Home functions are specialized entry points
      into reusable product discovery/search/stock/detail patterns.

  - rule: >
      A product card/listing may lead to a Product Detail page.

  - rule: >
      Different product functions can use different search inputs,
      filters, or contexts.

  - rule: >
      Item/SKU search is reused across multiple business functions.

  - rule: >
      The same Product Detail capability can be reached from multiple
      product-discovery flows.

  - rule: >
      Rivaah, Reports, Product Catalogue, Best Deal, and Manual Invoice
      are parent business functions with their own dedicated KBs.

  - rule: >
      Home navigation must respect the authenticated user's application
      access/role.

  - rule: >
      Customer and store context may influence downstream business
      functions.

