security:

  authentication_required: true

  authorization:
    description: >
      Access to individual Home functions may depend on the authenticated
      user's permissions. Exact role matrix remains unknown.

  context_security:
    - Store context must not be bypassed.
    - Customer context must not be unintentionally mixed between flows.
    - Downstream authorization must be validated by the corresponding
      child flow.

  sensitive_functions:
    - Manual Invoice
    - Customer-related functions
    - Administration
    - Home Delivery
    - Other transaction/report functions as applicable

  security_agent_reuse:
    description: >
      This Home/application map can be consumed by the Security Agent
      to enumerate reachable application functions and identify
      authorization boundaries.

