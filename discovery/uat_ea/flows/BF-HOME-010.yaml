business_flow:

  overview:
    description: >
      After successful authentication, the user lands on Home.
      Home acts as the application hub from which the user can enter
      different business functions.

  navigation:
    - step: 1
      action: Login successfully.

    - step: 2
      action: Load Endless Aisle Home page.

    - step: 3
      action: Verify Home page and primary navigation are available.

    - step: 4
      action: Select a business-function card or navigation item.

    - step: 5
      action: >
        Application navigates to the corresponding business-function
        page.

    - step: 6
      action: >
        Execute the selected child business flow.

  product_discovery_pattern:
    description: >
      Multiple Home functions provide different ways to discover,
      search, filter, or inspect products.

    common_pattern:
      - Home
      - Specialized Product Entry
      - Product Listing/Search
      - Product Card
      - Product Detail where applicable

    reusable_product_functions:
      - All Products
      - Item Search
      - Smart Image Search
      - Find Price
      - Estimation Slip
      - Solitaire UIN
      - Gold Coin Search
      - Gold Coin Stock Visibility
      - Stock Visibility
      - My Store Stock
      - Solitaire Products
      - New Collections
      - High Value Studded
      - Silver Collections
      - Size Based Search
      - National/Regional Best Seller

  item_search_pattern:
    description: >
      Item/SKU-oriented functions allow a user to enter an item identifier
      and retrieve product or stock information.

    observed_examples:
      - Item Search
      - Stock Visibility
      - Size Based Search
      - Solitaire UIN
      - Gold Coin Stock Visibility

  product_listing_pattern:
    description: >
      Product-listing functions display product cards which can lead
      to product-detail pages.

    observed_examples:
      - All Products
      - Product Search
      - Product Discount
      - Solitaire Products
      - New Collections
      - Look of the Week
      - Silver Collections
      - Gold Coin Search

  specialized_search_pattern:
    observed_examples:
      - Smart Image Search
      - Find Price
      - Estimation Slip
      - Size Based Search
      - Stock Visibility
      - Gold Coin Stock Visibility

expected_success:
  - Home loads successfully after authentication.
  - Home displays the Endless Aisle application interface.
  - Store context is visible.
  - Customer selection/context is available.
  - Primary navigation is available.
  - Business-function cards are available.
  - Selecting a valid Home function navigates to its intended page.
  - Product-oriented functions open their appropriate search/listing/detail flow.
  - Back/Home navigation can return the user to Home where supported.
  - Sign Out remains available through the application navigation.

