flow_id: BF-ADMINISTRATION-009

flow_name: Administration

application:
  name: Endless Aisle
  platform: Oracle APEX
  application_id: 1002
  environment: DEV/UAT

purpose:
  description: >
    Provides authorized administrators with application configuration,
    maintenance, user/access management, monitoring, dashboards, and
    operational reporting capabilities.

entry_point:
  page: Home
  navigation: >
    Login → Home → Administration → Administration Master Page

actors:
  - Administrator

preconditions:
  - User is authenticated.
  - User has administrator/authorized access.
  - Application is available.
  - Required administration functionality is available.

pages:
  - name: Home
    route: /ords/r/tjdcom/ea/home

  - name: Administration
    route: /ords/r/tjdcom/ea/administration

components:
  - name: Administration
    type: Navigation/Card
    locator:
      id: t_MenuNav_7i
    action: Opens Administration.

  - name: Administration Master Page
    type: Administration Dashboard
    action: >
      Displays available configuration, maintenance, monitoring,
      reporting, and access-management functions.

  - name: App Configuration
    type: Configuration
    action: >
      Provides application preference/configuration functionality.

  - name: Maintain Item Size
    type: Maintenance
    action: >
      Provides item-size maintenance functionality.

  - name: Maintain ECOM Item Exception
    type: Maintenance
    action: >
      Provides ECOM item-exception maintenance functionality.

  - name: Maintain Users
    type: User Management
    action: >
      Provides user-management functionality.

  - name: Maintain LOVs
    type: Maintenance
    action: >
      Provides List of Values maintenance functionality.

  - name: Maintain New Collections
    type: Maintenance
    action: >
      Provides collection maintenance functionality.

  - name: Theme Style Selection
    type: Configuration
    action: >
      Provides application theme/style configuration functionality.

  - name: Dashboard
    type: Dashboard
    action: >
      Opens the application activity dashboard.

  - name: Top Users
    type: Report
    action: >
      Displays user activity information.

  - name: Application Error Log
    type: Monitoring/Report
    action: >
      Displays application error information.

  - name: Page Performance
    type: Monitoring/Report
    action: >
      Displays page performance information.

  - name: Page Views
    type: Monitoring/Report
    action: >
      Displays page-view information.

  - name: Users
    type: User/Access Management
    action: >
      Provides user/access-related administration functionality.

  - name: Access Control
    type: Authorization Management
    action: >
      Provides access-control functionality.

business_flow:
  steps:
    - step: 1
      action: Navigate to Home after authentication.

    - step: 2
      action: Open Administration.

    - step: 3
      action: >
        Verify that the Administration Master Page loads.

    - step: 4
      action: >
        Verify that available administration functions are displayed.

    - step: 5
      action: >
        Open each applicable administration function.

    - step: 6
      action: >
        Verify that configuration, maintenance, dashboard,
        monitoring, or report pages load successfully.

    - step: 7
      action: >
        Validate safe, non-destructive controls where applicable.

    - step: 8
      action: >
        Do not create, modify, delete, or otherwise perform
        sensitive administrative changes during generic QA/sanity testing.

    - step: 9
      action: >
        Validate Access Control page availability and loading.

    - step: 10
      action: >
        Validate monitoring/report pages by confirming successful
        page/report loading.

    - step: 11
      action: >
        Use Back where available.

    - step: 12
      action: >
        Verify that Back returns to the Administration Master Page.

expected_success:
  - Administration opens successfully from Home.
  - Administration Master Page loads successfully.
  - Authorized administrator can access administration functions.
  - Configuration pages load successfully.
  - Maintenance pages load successfully.
  - User/access-management pages load successfully.
  - Monitoring/reporting pages load successfully.
  - Access Control page loads successfully.
  - Applicable safe controls are accessible.
  - Generic sanity testing does not modify sensitive records.
  - Back returns to the Administration Master Page.

