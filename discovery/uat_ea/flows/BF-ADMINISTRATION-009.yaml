business_rules:
  - rule: >
      Administration provides application configuration,
      maintenance, user/access management, monitoring,
      dashboards, and reporting capabilities.

  - rule: >
      Administration access is restricted to administrators/
      authorized administrative users.

  - rule: >
      Generic QA/sanity testing must not modify application,
      user, access-control, or other sensitive records.

  - rule: >
      Configuration and maintenance pages may be inspected and
      their safe controls validated.

  - rule: >
      Actual record creation/modification is not required for
      generic Administration QA.

  - rule: >
      User creation or modification must not be performed
      during generic QA automation.

  - rule: >
      Access Control must be included in Administration validation.

  - rule: >
      Dashboard, Top Users, Application Error Log,
      Page Performance, and Page Views can be validated
      through successful page/report loading.

  - rule: >
      Administration respects the current store/customer context.

  - rule: >
      Back from individual Administration functions returns
      to the Administration Master Page where applicable.

  - rule: >
      Sensitive administrative changes must not be performed
      automatically.

unknown_business_rules:
  - Exact administrator role/permission hierarchy.
  - Exact permissions required for each individual Administration function.
  - Exact store/customer context behavior for each administration function.
  - Exact validation rules for individual maintenance forms.
  - Exact data requirements for configuration and maintenance operations.
  - Exact audit requirements for administrative actions.

