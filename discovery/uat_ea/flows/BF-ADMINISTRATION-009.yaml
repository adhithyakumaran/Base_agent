automation:
  recommended_framework: Playwright

  primary_locators:
    - >
      Use stable APEX IDs or validated DOM attributes for
      Administration navigation.

    - >
      Use validated administration-function labels or stable
      DOM relationships for selecting functions.

  fallback_locators:
    - >
      Use accessible labels.
    - >
      Use stable APEX attributes.
    - >
      Use validated DOM relationships.

  locator_validation:
    rule: >
      Every locator must resolve to exactly one intended element.
    resolution:
      0: Try next fallback.
      1: Accept locator.
      greater_than_1: Reject as ambiguous.

  reusable_actions:
    - Navigate to Administration
    - Validate Administration Master Page
    - Locate administration function
    - Open configuration page
    - Open maintenance page
    - Open monitoring page
    - Open dashboard
    - Open user/access-management page
    - Validate safe controls
    - Navigate back

  safety_guardrails:
    generic_sanity:
      allow:
        - Page navigation
        - Page-load validation
        - Non-destructive control inspection
        - Filter validation
        - Report/dashboard loading
        - Back navigation

      deny:
        - Create sensitive records
        - Modify sensitive records
        - Delete records
        - Change user permissions
        - Change Access Control
        - Change application security configuration
        - Change production-like configuration
        - Execute irreversible administrative operations

    sensitive_change_policy:
      description: >
        Administration automation must stop before any sensitive
        change and require explicit controlled test-case authorization.

  self_healing:
    enabled: true
    behavior:
      - Capture failed locator and DOM/page evidence.
      - Search for a validated alternative locator.
      - Validate uniqueness.
      - Use fallback only when safely validated.
      - Record locator degradation.
      - Propose permanent locator update.
      - Require human approval before permanent automation modification.

test_data:
  required:
    - Valid authenticated administrator account
    - Safe test environment
    - Non-sensitive test data where required

  restrictions:
    - Do not use production-sensitive data for destructive testing.
    - Do not store credentials.
    - Do not store session IDs.
    - Do not store cookies or authentication tokens.
    - Do not modify real user/access records during generic QA.

security:
  authentication_required: true

  authorization:
    - Administration access requires administrator/authorized access.

  sensitive_data:
    - Administration may expose sensitive configuration and user/access data.
    - Do not store sensitive administrative data in the KB.
    - Do not store credentials, tokens, cookies, or session identifiers.

  validation:
    - Verify unauthorized users cannot access Administration where
      authorization testing is explicitly included.
    - Verify administrative pages respect current store/customer context.

  change_protection:
    - Sensitive changes must not be executed during generic sanity testing.
    - User/access-control changes require dedicated controlled tests.
    - Application configuration changes require dedicated controlled tests.

