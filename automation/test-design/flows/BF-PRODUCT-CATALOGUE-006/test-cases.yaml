  - regression
  - bf-product-catalogue-006
  linked_scenario: SC-BF-PRODUCT-CATALOGUE-006-001
  preconditions:
  - User is authenticated.
  - User has access to the Product Catalogue.
  - Application is available.
  - Catalogue data/documents are available.
  steps_summary: Execute primary business_flow steps end-to-end.
  expected_result:
  - Product Catalogue opens successfully from Home.
  - Available catalogue cards are displayed.
  - Users can browse the available catalogues.
  - Users can open/download catalogue PDFs.
  - Direct PDF catalogues open in a new browser tab/window.
  - Collection catalogue cards open their corresponding internal Collection Catalogue
    page.
  - Available language versions can be selected where applicable.
  - The resulting PDF corresponds to the selected catalogue/language.
  - Back from an internal Collection Catalogue returns to Product Catalogue.
  - Product Catalogue is accessible to authenticated users.
