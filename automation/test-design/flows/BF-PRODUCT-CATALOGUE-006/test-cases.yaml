    framework: playwright
    spec_glob: tests/**/BF-PRODUCT-CATALOGUE-006*.spec.ts
    test_match: TC-BF-PRODUCT-CATALOGUE-006-P01
  business_rules_validated:
  - Product Catalogue allows users to browse available product catalogues.
  - Product Catalogue allows users to open/download catalogue documents.
  - Direct catalogue PDF links open the PDF in a new browser tab/window.
  - Collection catalogue cards navigate to their corresponding internal Collection
    Catalogue page.
  - Users can select the required catalogue language where multiple language versions
    are provided.
