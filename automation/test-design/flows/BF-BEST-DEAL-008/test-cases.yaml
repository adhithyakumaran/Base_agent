  - Users can filter Best Deal products using the available product and classification
    filters.
  - Products displayed through Best Deal must represent discounted/Best Deal products.
  - Out-of-stock discounted products can still be viewed.
  - A selected Best Deal product can be opened in Discount Product Details - All Store.
