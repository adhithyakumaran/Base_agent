[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base-agent"
version = "0.1.0"
description = "Deterministic-first enterprise agent runtime for QA/Security plugins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Base Agent Team" }]
dependencies = [
  "pydantic>=2.6",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
browser = ["playwright>=1.40"]
llm = ["litellm>=1.40"]

[project.scripts]
base-agent = "base_agent.api:main"
qa-orchestrator = "qa_orchestrator.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]