[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "base-agent"
version = "0.2.0"
description = "ScoutAI enterprise QA agent — deterministic-first runtime + orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "ScoutAI Team" }]
dependencies = [
  "pydantic>=2.6",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
browser = ["playwright>=1.40"]
llm = ["litellm>=1.40,<1.57"]

[project.scripts]
base-agent = "base_agent.api:main"
qa-orchestrator = "qa_orchestrator.api:main"

[tool.setuptools.packages.find]
where = ["services/agent-runtime", "services/qa-orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/agent-runtime", "services/qa-orchestrator"]
